# Build and test every supported platform; release.yml handles packaging.
#
# Rust caches use one pinned toolchain and only main pushes save, so PR
# caches can't evict the ones everybody restores. setup-zig caches separately.
name: ci

on:
  push:
    branches: [main, rebrand]
  # No paths-ignore here: CI is required to merge, so every PR needs it.
  pull_request:

permissions:
  contents: read

# A newer push cancels older runs, on a PR and on a branch: PRs were tested
# before merging, so only the branch's newest commit needs a run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0
  # In the cache key: ghostty-sys can't tell when Zig changes.
  ZIG_VERSION: 0.17.0
  # Where scripts/zig-fetch puts the packages and cargo's `zig build` finds them.
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  # File/line backtraces without full debug info: smaller target, faster cache.
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  # Incremental state only bloats a cache: CI builds each commit once.
  CARGO_INCREMENTAL: "0"
  SAVE_CACHES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  platform-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match release's glibc floor and native platform runners.
          - { platform: linux-x86_64, runner: ubuntu-22.04 }
          - { platform: macos-aarch64, runner: macos-15 }
          - { platform: windows-x86_64, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # The whole target/, like release.yml: rust-cache drops the vendored crates.
      # Keyed by what the dependencies build from, so a source-only push
      # restores an exact hit and saves nothing (no cache per commit).
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v2-${{ matrix.platform }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**', 'crates/**', '.github/workflows/ci.yml') }}
          restore-keys: ci-v2-${{ matrix.platform }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-
      # Zig has no download timeout: a stalled GitHub fetch hung macOS builds.
      # Fetch the packages here, with time limits and retries, before cargo's
      # build script runs `zig build`; it then finds them in the cache.
      - name: Restore Zig packages
        id: zig-packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-pkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ hashFiles('vendor/ghostty/**/build.zig.zon') }}
      - name: Fetch Zig packages
        timeout-minutes: 20
        run: scripts/zig-fetch vendor/ghostty
      - name: Save Zig packages
        if: env.SAVE_CACHES == 'true' && steps.zig-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: ${{ steps.zig-packages.outputs.cache-primary-key }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # A stuck package mirror fails here in minutes, not at the job's limit.
        timeout-minutes: 10
        run: |
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt update
          sudo apt-get $apt install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev mesa-vulkan-drivers libfontconfig-dev libfreetype-dev
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Keep unchanged sources fresh
        run: scripts/ci-sources restore
      # Compile the screenshot harness everywhere, even without a desktop.
      # Disable optimized dev dependencies in CI to reduce test compile time.
      - name: Build tests
        # A stuck build fails here, not at the job's limit.
        timeout-minutes: 25
        run: cargo test --locked --config 'profile.dev.package."*".opt-level=0' --no-run
      - name: Note the sources the cache was built from
        if: env.SAVE_CACHES == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: scripts/ci-sources record
      - name: Save build cache
        if: env.SAVE_CACHES == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cache-paths
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Tests
        run: |
          only=()
          if [ "$RUNNER_OS" != Linux ]; then
            for t in tests/*.rs; do
              name=$(basename "$t" .rs)
              [ "$name" = shot_pixels ] || only+=(--test "$name")
            done
            only+=(--bins)
          fi
          threads=()
          if [ "$RUNNER_OS" = Linux ]; then
            threads=(-- --test-threads 4)
          fi
          cargo test --locked --config 'profile.dev.package."*".opt-level=0' "${only[@]}" "${threads[@]}"
      # Windows runners lack an interactive desktop. Linux uses headless Vulkan
      # in the suite above; macOS exercises the native window renderer here.
      - name: Screenshot pixels
        if: runner.os == 'macOS'
        timeout-minutes: 5
        env:
          H0X_ADE_SHOT_NATIVE_TEST: "1"
        run: cargo test --locked --config 'profile.dev.package."*".opt-level=0' --test shot_pixels
      - name: Check release packaging
        if: matrix.platform == 'linux-x86_64'
        run: python3 -m unittest discover -s scripts -p test_distribution.py
      # Pinned by version and the sha256 of the release zip (from the release's SHASUMS256.txt).
      - name: Install Bun
        if: matrix.platform == 'linux-x86_64'
        env:
          BUN_VERSION: 1.4.4
          BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip"
          echo "$BUN_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun"
          install -D -m 755 "$RUNNER_TEMP/bun/bun-linux-x64/bun" ~/.bun/bin/bun
      - name: Check documentation
        if: matrix.platform == 'linux-x86_64'
        run: |
          ~/.bun/bin/bun test scripts/docs.test.ts
          ~/.bun/bin/bun scripts/docs.ts check
      - name: Check mod scripts
        if: matrix.platform == 'linux-x86_64'
        run: ~/.bun/bin/bun test scripts/files.test.ts scripts/machine-add.test.ts scripts/picker.test.ts scripts/palette.test.ts scripts/agents.test.ts scripts/rest.test.ts scripts/spaces.test.ts scripts/worktree.test.ts

  # The real app, typed into a terminal: it opens in that folder (tests/launch_folder.rs).
  # Needs a desktop (Xvfb on Linux) and the pinned h0x-core release, whose
  # signature the test checks against the release key before anything in it runs.
  launch-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-22.04, core: h0x-core-linux-x86_64.tar.gz }
          - { platform: macos-aarch64, runner: macos-15, core: h0x-core-macos-aarch64.tar.gz }
          - { platform: windows-x86_64, runner: windows-2022, core: h0x-core-windows-x86_64.zip }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # The platform-tests cache, restored only: same key, same build flags.
      - name: Restore build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v2-${{ matrix.platform }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**', 'crates/**', '.github/workflows/ci.yml') }}
          restore-keys: ci-v2-${{ matrix.platform }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-
      - name: Restore Zig packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-pkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ hashFiles('vendor/ghostty/**/build.zig.zon') }}
      - name: Fetch Zig packages
        timeout-minutes: 20
        run: scripts/zig-fetch vendor/ghostty
      - name: Linux build and desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt update
          sudo apt-get $apt install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev mesa-vulkan-drivers libfontconfig-dev libfreetype-dev \
            xvfb xauth
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Keep unchanged sources fresh
        run: scripts/ci-sources restore
      - name: Build the app and the test
        timeout-minutes: 25
        run: cargo test --locked --config 'profile.dev.package."*".opt-level=0' --test launch_folder --no-run
      # Downloaded only; tests/launch_folder.rs checks the .minisig before unpacking.
      - name: Fetch the pinned h0x-core release
        timeout-minutes: 5
        run: |
          version=$(tr -d '[:space:]' < distribution/core-version)
          dir="$RUNNER_TEMP/h0x-core-release"
          mkdir -p "$dir"
          base="https://github.com/vjk7989/h0x-ADE-core/releases/download/v$version/${{ matrix.core }}"
          curl -fsSL --retry 3 --proto '=https' --proto-redir '=https' -o "$dir/${{ matrix.core }}" "$base"
          curl -fsSL --retry 3 --proto '=https' --proto-redir '=https' -o "$dir/${{ matrix.core }}.minisig" "$base.minisig"
          echo "H0X_E2E_CORE_ARCHIVE=$dir/${{ matrix.core }}" >> "$GITHUB_ENV"
      - name: Launch from a shell, end to end
        timeout-minutes: 15
        env:
          H0X_E2E: "1"
        run: |
          run=(cargo test --locked --config 'profile.dev.package."*".opt-level=0' --test launch_folder -- --ignored --nocapture)
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" "${run[@]}"
          else
            "${run[@]}"
          fi

  # Security advisories (RustSec) in the dependencies: deny.toml.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # Keep the required check name stable while requiring every platform.
  test:
    needs: [platform-tests, launch-e2e, advisories]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.platform-tests.result }}" = success ] && [ "${{ needs.launch-e2e.result }}" = success ] && [ "${{ needs.advisories.result }}" = success ]'
